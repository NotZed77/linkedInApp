

server.port: 8080

jwt:
  secretKey: caijnweovbewbgb23g2p8th2gvqn2gi42hgu2nvq

eureka.client.service-url.defaultZone: http://localhost:8761/eureka

spring:
  application.name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/v1/users/**
            filters:
              - StripPrefix= 2

          - id: post-service
            uri: lb://POST-SERVICE
            predicates:
                - Path=/api/v1/posts/**
            filters:
              - StripPrefix= 2
              - name: AuthenticationFilter

          - id: connections-service
            uri: lb://CONNECTIONS-SERVICE
            predicates:
              - Path=/api/v1/connections/**
            filters:
              - StripPrefix= 2
              - name: AuthenticationFilter